<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reveal.js presentations" />
    <title>Serena's Slides</title>
  </head>
  <body>
    <main id="deck-selector" class="deck-selector" hidden>
      <div class="deck-selector__panel">
        <p class="deck-selector__eyebrow">Serena's Reveal.js presentations</p>
        <h1>Choose a slide deck</h1>
        <p id="deck-selector-message" class="deck-selector__message">
          Select a presentation to begin.
        </p>
        <div class="deck-controls">
          <label class="deck-control">
            <span>Filter by name</span>
            <input
              id="deck-name-filter"
              type="search"
              placeholder="Search decks"
              autocomplete="off"
            />
          </label>
          <label class="deck-control">
            <span>Sort by</span>
            <select id="deck-sort">
              <option value="default">Default (pinned first)</option>
              <option value="name">Name (A–Z)</option>
              <option value="created-newest">Creation date (newest)</option>
              <option value="created-oldest">Creation date (oldest)</option>
            </select>
          </label>
        </div>
        <div
          id="deck-filters"
          class="deck-filters"
          role="group"
          aria-label="Filter decks by tag"
        ></div>
        <p
          id="deck-empty-message"
          class="deck-selector__empty"
          role="status"
          hidden
        >
          No decks match these filters.
        </p>
        <ul id="deck-list" class="deck-list"></ul>
      </div>
    </main>

    <div id="presentation" class="reveal" hidden>
      <div class="slides"></div>
    </div>

    <div
      id="deck-toolbar"
      class="deck-toolbar"
      role="group"
      aria-label="Presentation actions"
      hidden
    >
      <button id="back-to-decks" type="button">← Back to decks</button>
      <button id="print-mode" type="button">Print mode</button>
    </div>

    <noscript>This presentation requires JavaScript.</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
