<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Markdown-first Reveal.js presentation" />
    <title>Reveal.js Markdown Slides</title>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="/slides.md"
          data-separator="^---"
          data-separator-vertical="^\+\+\+"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
