<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reveal.js presentations" />
    <title>Reveal.js Slides</title>
  </head>
  <body>
    <main id="deck-selector" class="deck-selector" hidden>
      <div class="deck-selector__panel">
        <p class="deck-selector__eyebrow">Reveal.js presentations</p>
        <h1>Choose a slide deck</h1>
        <p id="deck-selector-message" class="deck-selector__message">
          Select a presentation to begin.
        </p>
        <ul id="deck-list" class="deck-list"></ul>
      </div>
    </main>

    <div id="presentation" class="reveal" hidden>
      <div class="slides"></div>
    </div>

    <noscript>This presentation requires JavaScript.</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
